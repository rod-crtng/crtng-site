<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRTNG — Produtora Audiovisual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap" rel="stylesheet">

<!-- CSS Bibliotecas CDN -->
<link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css">

<style>
  :root {
    --green: #03FF5C;
    --green-dim: #02b842;
    --black: #0a0a0a;
    --black-2: #141414;
    --black-3: #1c1c1c;
    --white: #f5f5f0;
    --gray: #8a8a85;
    --gray-dim: #4a4a48;
    --font-serif: 'Fraunces', serif;
    --font-sans: 'Montserrat', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Impede scroll de aparecer durante loading */
  html, body {
    overflow-x: hidden;
  }

  body {
    font-family: var(--font-sans);
    background: var(--black);
    color: var(--white);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    cursor: none; /* Oculta cursor padrão para usar customizado */
  }

  /* Desativa cursor customizado em telas touch */
  @media (max-width: 900px) {
    body { cursor: default; }
  }

  /* GRAIN TEXTURE — toda a página */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.08;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  /* ==========================================================================
     PRELOADER CINEMATOGRÁFICO
     ========================================================================== */
  #preloader {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .preloader-shutter {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    pointer-events: none;
  }

  .shutter-panel {
    flex: 1;
    background: var(--black);
    width: 100%;
    transition: transform 1.2s cubic-bezier(0.85, 0, 0.15, 1);
  }

  .shutter-top {
    transform-origin: top;
    border-bottom: 1px solid rgba(3, 255, 92, 0.1);
  }

  .shutter-bottom {
    transform-origin: bottom;
    border-top: 1px solid rgba(3, 255, 92, 0.1);
  }

  .preloader-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    text-align: center;
  }

  .preloader-logo {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.7;
  }

  .preloader-logo span {
    color: var(--green);
  }

  .preloader-counter {
    font-family: var(--font-serif);
    font-size: clamp(80px, 15vw, 200px);
    font-weight: 300;
    color: var(--white);
    font-style: italic;
    line-height: 0.8;
    letter-spacing: -0.05em;
    display: flex;
    align-items: baseline;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
  }

  .preloader-counter span {
    color: var(--green);
    font-size: clamp(24px, 4vw, 48px);
    font-weight: 500;
    margin-left: 8px;
  }

  .preloader-bar-wrapper {
    width: 240px;
    height: 1px;
    background: rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
  }

  .preloader-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
  }

  /* ==========================================================================
     CURSOR CUSTOMIZADO
     ========================================================================== */
  .custom-cursor {
    width: 8px;
    height: 8px;
    background: var(--white);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
    transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s;
  }

  .custom-cursor-follower {
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: var(--black);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    background-color: transparent;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), height 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s, background-color 0.4s, opacity 0.4s;
  }

  /* Hover active states */
  .custom-cursor.hovered {
    width: 0px;
    height: 0px;
  }

  .custom-cursor-follower.hovered {
    width: 88px;
    height: 88px;
    border-color: var(--green);
    background: var(--green);
    opacity: 1;
  }

  /* ==========================================================================
     NAV FIXO E MODERNO
     ========================================================================== */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 28px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    mix-blend-mode: difference;
    color: var(--white);
    opacity: 0; /* Animado via JS */
  }

  .logo-mark {
    font-family: var(--font-sans);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--white);
    text-decoration: none;
  }

  .logo-mark span {
    color: var(--green);
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    color: var(--white);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: opacity 0.3s;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 100%; height: 1px;
    background: var(--green);
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .nav-links a:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .nav-links a:hover {
    opacity: 1;
  }

  /* ==========================================================================
     HERO CINEMÁTICO
     ========================================================================== */
  .hero {
    height: 100vh;
    min-height: 700px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(3, 255, 92, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(3, 255, 92, 0.04) 0%, transparent 50%),
      linear-gradient(180deg, var(--black) 0%, var(--black-2) 100%);
    z-index: 0;
  }

  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.15) 4px
    );
    opacity: 0.4;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 24px;
  }

  .hero-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    opacity: 0;
  }

  .hero-eyebrow::before,
  .hero-eyebrow::after {
    content: '';
    width: 40px;
    height: 1px;
    background: var(--green);
  }

  /* Clip-path container para revelar texto de forma premium */
  .title-wrapper {
    display: inline-block;
    overflow: hidden;
    line-height: 1.05;
    margin-bottom: 12px;
  }

  .hero h1 {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(56px, 9vw, 140px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--green);
    font-weight: 300;
  }

  .hero h1 .word-inner {
    display: inline-block;
    transform: translateY(100%);
    will-change: transform;
  }

  .hero-sub {
    font-size: 14px;
    color: var(--gray);
    letter-spacing: 0.05em;
    max-width: 520px;
    margin: 0 auto;
    opacity: 0;
  }

  .scroll-indicator {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--gray);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    z-index: 2;
    opacity: 0;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(180deg, transparent, var(--green));
    animation: scrollPulse 2.5s ease-in-out infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(0.3); opacity: 0.3; transform-origin: top; }
    50% { transform: scaleY(1); opacity: 1; transform-origin: top; }
  }

  /* ==========================================================================
     SEÇÃO SOBRE — GRID COM PINNING E ATIVAÇÃO NEON DOS PILARES
     ========================================================================== */
  .sobre {
    padding: 200px 48px;
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 60px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .section-label::before {
    content: '';
    width: 60px;
    height: 1px;
    background: var(--green);
  }

  .sobre-grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 100px;
    align-items: start;
  }

  .sobre-sticky-left {
    position: sticky;
    top: 150px;
    align-self: start;
  }

  .sobre h2 {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(40px, 5vw, 72px);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }

  .sobre h2 em {
    font-style: italic;
    color: var(--green);
  }

  .sobre-scroll-right {
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .sobre-text p {
    font-size: 18px;
    line-height: 1.7;
    color: var(--gray);
    margin-bottom: 24px;
  }

  .sobre-text p strong {
    color: var(--white);
    font-weight: 600;
  }

  .pilares {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .pilar {
    border-top: 1px solid var(--gray-dim);
    padding: 28px 20px 20px 20px;
    border-radius: 4px;
    background: transparent;
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0.4;
    transform: translateY(20px);
  }

  .pilar-num {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--gray);
    font-size: 16px;
    margin-bottom: 12px;
    transition: color 0.6s;
  }

  .pilar-title {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 12px;
    color: var(--white);
  }

  .pilar p {
    font-size: 14px;
    color: var(--gray);
    line-height: 1.6;
    transition: color 0.6s;
  }

  /* ==========================================================================
     SEÇÃO SERVIÇOS — REVELAÇÃO INTERATIVA DE BACKGROUND EM HOVER
     ========================================================================== */
  .servicos {
    padding: 200px 48px;
    background: var(--black-2);
    position: relative;
    overflow: hidden;
  }

  .servicos-header {
    max-width: 1400px;
    margin: 0 auto 100px;
  }

  .servicos h2 {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(48px, 7vw, 100px);
    line-height: 1;
    letter-spacing: -0.02em;
    max-width: 900px;
  }

  .servicos h2 em {
    font-style: italic;
    color: var(--green);
  }

  .servicos-list {
    max-width: 1400px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  .servico-item {
    display: grid;
    grid-template-columns: 80px 1.5fr 2fr 1fr;
    gap: 40px;
    padding: 48px 24px;
    border-top: 1px solid var(--gray-dim);
    align-items: center;
    transition: padding 0.5s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.5s;
    position: relative;
  }

  .servico-item:last-child {
    border-bottom: 1px solid var(--gray-dim);
  }

  .servico-item:hover {
    padding-left: 48px;
    background-color: rgba(255, 255, 255, 0.01);
  }

  .servico-item:hover .servico-arrow {
    transform: translateX(12px);
    color: var(--green);
  }

  .servico-item:hover .servico-num {
    color: var(--green);
  }

  .servico-num {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--gray);
    font-size: 16px;
    transition: color 0.4s;
  }

  .servico-title {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(24px, 2.4vw, 36px);
    letter-spacing: -0.02em;
  }

  .servico-desc {
    font-size: 15px;
    color: var(--gray);
    line-height: 1.6;
  }

  .servico-arrow {
    font-size: 28px;
    color: var(--gray-dim);
    text-align: right;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Container de imagem flutuante para Serviços (Desktop) */
  .floating-service-preview {
    position: fixed;
    width: 380px;
    height: 240px;
    pointer-events: none;
    z-index: 95;
    overflow: hidden;
    border-radius: 12px;
    opacity: 0;
    transform: scale(0.8) translate(-50%, -50%);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 30px 60px rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .floating-service-preview-inner {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: transform 0.3s;
  }

  /* Gradientes abstratos cinematográficos de background para visualização */
  .srv-preview-1 { background: radial-gradient(circle at 30% 30%, rgba(3, 255, 92, 0.4), transparent 70%), linear-gradient(135deg, #0f2214, #050505); }
  .srv-preview-2 { background: radial-gradient(circle at 70% 30%, rgba(3, 255, 92, 0.3), transparent 70%), linear-gradient(45deg, #101c15, #050505); }
  .srv-preview-3 { background: radial-gradient(circle at 50% 50%, rgba(3, 255, 92, 0.35), transparent 70%), linear-gradient(180deg, #141f18, #050505); }
  .srv-preview-4 { background: radial-gradient(circle at 30% 70%, rgba(3, 255, 92, 0.4), transparent 70%), linear-gradient(135deg, #182a1c, #050505); }
  .srv-preview-5 { background: radial-gradient(circle at 70% 70%, rgba(3, 255, 92, 0.3), transparent 70%), linear-gradient(225deg, #0e1e12, #050505); }

  /* ==========================================================================
     SEÇÃO PORTFÓLIO — PARALLAX DYNAMIC E EMBED OPTIMIZED
     ========================================================================== */
  .portfolio {
    padding: 200px 0;
    position: relative;
  }

  .portfolio-header {
    max-width: 1400px;
    margin: 0 auto 120px;
    padding: 0 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .portfolio h2 {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(48px, 7vw, 100px);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .portfolio h2 em {
    font-style: italic;
    color: var(--green);
  }

  .portfolio-count {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 18px;
    color: var(--gray);
  }

  .portfolio-grid {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 48px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 40px;
  }

  .case {
    position: relative;
    will-change: transform;
  }

  .case-1 { grid-column: 1 / 8; grid-row: 1; }
  .case-2 { grid-column: 8 / 13; grid-row: 1 / 3; margin-top: 60px; }
  .case-3 { grid-column: 1 / 7; grid-row: 2; margin-top: 120px; }
  .case-4 { grid-column: 1 / 7; grid-row: 3; margin-top: 80px; }
  .case-5 { grid-column: 8 / 13; grid-row: 3; margin-top: 100px; }

  .case-media {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: var(--black-2);
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.03);
    cursor: pointer;
  }

  .case-1 .case-media { aspect-ratio: 16/9; }
  .case-2 .case-media { aspect-ratio: 9/16; }
  .case-3 .case-media { aspect-ratio: 16/9; }
  .case-4 .case-media { aspect-ratio: 16/9; }
  .case-5 .case-media { aspect-ratio: 9/16; }

  /* Elemento de preview thumbnail */
  .case-thumbnail {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .case-media:hover .case-thumbnail {
    transform: scale(1.05);
  }

  /* Botão play dinâmico do card */
  .case-play-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 68px; height: 68px;
    background: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--black);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 12px 30px rgba(3, 255, 92, 0.4);
    pointer-events: none;
    z-index: 3;
  }

  .case-media:hover .case-play-btn {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .case-play-btn svg {
    margin-left: 4px;
    fill: var(--black);
  }

  .case-media::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0, 0, 0, 0.6) 100%);
    opacity: 0.8;
    pointer-events: none;
    transition: opacity 0.5s;
    z-index: 2;
  }

  .case-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 24px;
    padding: 0 4px;
  }

  .case-title {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: -0.01em;
  }

  .case-category {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gray);
  }

  /* ==========================================================================
     SEÇÃO FRAMES — SCROLL VERTICAL -> HORIZONTAL E EFEITO TILT 3D
     ========================================================================== */
  .frames-pin-container {
    position: relative;
    width: 100%;
  }

  .frames {
    padding: 140px 0;
    overflow: hidden;
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .frames-header {
    max-width: 1400px;
    margin: 0 auto 56px;
    padding: 0 48px;
    width: 100%;
  }

  .frames h2 {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(48px, 7vw, 100px);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .frames h2 em {
    font-style: italic;
    color: var(--green);
  }

  .frames-container-inner {
    width: 100%;
    overflow: hidden;
  }

  .frames-track {
    display: flex;
    gap: 32px;
    padding: 0 48px;
    width: max-content;
    will-change: transform;
  }

  .frame {
    flex-shrink: 0;
    width: 440px;
    height: 280px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.05);
    transform-style: preserve-3d;
    perspective: 1000px;
    transition: transform 0.1s ease-out;
  }

  .frame-bg {
    position: absolute;
    inset: -10px; /* Bleed sutil para paralaxe interna */
    background-size: cover;
    background-position: center;
    pointer-events: none;
    transition: transform 0.2s ease-out;
  }

  .frame::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(0, 0, 0, 0.15) 2px,
      rgba(0, 0, 0, 0.15) 4px
    );
    pointer-events: none;
  }

  .frame-1 { background: radial-gradient(ellipse at 30% 40%, rgba(3, 255, 92, 0.18), transparent 60%), linear-gradient(135deg, #0a1a0e, #050505); }
  .frame-2 { background: radial-gradient(ellipse at 70% 60%, rgba(255, 200, 100, 0.12), transparent 60%), linear-gradient(180deg, #1a1410, #050505); }
  .frame-3 { background: radial-gradient(circle at 50% 50%, rgba(3, 255, 92, 0.25), transparent 50%), linear-gradient(45deg, #0a0a0a, #1a1a1a); }
  .frame-4 { background: radial-gradient(ellipse at 20% 80%, rgba(100, 150, 255, 0.1), transparent 60%), linear-gradient(180deg, #0f1118, #050505); }
  .frame-5 { background: radial-gradient(ellipse at 80% 30%, rgba(3, 255, 92, 0.15), transparent 65%), linear-gradient(135deg, #1a1a1a, #0a0a0a); }
  .frame-6 { background: radial-gradient(ellipse at 50% 20%, rgba(255, 100, 100, 0.08), transparent 60%), linear-gradient(180deg, #181010, #050505); }
  .frame-7 { background: radial-gradient(ellipse at 30% 70%, rgba(3, 255, 92, 0.22), transparent 55%), linear-gradient(45deg, #0a1a0e, #141414); }
  .frame-8 { background: radial-gradient(circle at 70% 70%, rgba(200, 200, 255, 0.07), transparent 60%), linear-gradient(135deg, #0a0a0a, #1a1a1a); }

  .frame-label {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 2;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.6;
    pointer-events: none;
    transform: translateZ(20px); /* Traz o texto para frente no efeito 3D */
  }

  /* ==========================================================================
     CLIENTES
     ========================================================================== */
  .clientes {
    padding: 200px 48px;
    background: var(--black-2);
    text-align: center;
  }

  .clientes h2 {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(40px, 5vw, 72px);
    margin-bottom: 80px;
    letter-spacing: -0.02em;
  }

  .clientes h2 em {
    font-style: italic;
    color: var(--green);
  }

  .clientes-list {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 60px 40px;
  }

  .cliente {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(28px, 3vw, 42px);
    letter-spacing: -0.01em;
    color: var(--gray);
    transition: color 0.4s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: default;
    position: relative;
  }

  .cliente:hover {
    color: var(--green);
    transform: scale(1.05);
  }

  .cliente em {
    font-style: italic;
  }

  /* ==========================================================================
     CONTATO
     ========================================================================== */
  .contato {
    padding: 200px 48px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .contato-bg-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(200px, 30vw, 400px);
    color: #121212;
    pointer-events: none;
    white-space: nowrap;
    z-index: 0;
    will-change: transform;
  }

  .contato-content {
    position: relative;
    z-index: 2;
  }

  .contato-eyebrow {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 40px;
  }

  .contato h2 {
    font-family: var(--font-serif);
    font-weight: 300;
    font-size: clamp(56px, 9vw, 140px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 60px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
  }

  .contato h2 em {
    font-style: italic;
    color: var(--green);
  }

  .contato-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 22px 40px;
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    z-index: 1;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green);
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: -1;
  }

  .btn:hover::before {
    transform: translateY(0);
  }

  .btn:hover {
    color: var(--black);
    border-color: var(--green);
  }

  .btn-primary {
    background: var(--green);
    color: var(--black);
    border-color: var(--green);
  }

  .btn-primary::before {
    background: var(--white);
  }

  .btn-primary:hover {
    color: var(--black);
    border-color: var(--white);
  }

  /* ==========================================================================
     FOOTER
     ========================================================================== */
  footer {
    padding: 48px;
    border-top: 1px solid var(--gray-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gray);
    position: relative;
    z-index: 2;
  }

  footer .logo-mark {
    font-size: 14px;
  }
